<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="200" r="150" fill="url(#bg2)" opacity="0.3"/>
  <circle cx="1720" cy="880" r="200" fill="url(#bg2)" opacity="0.2"/>
  <circle cx="1500" cy="150" r="100" fill="url(#bg2)" opacity="0.25"/>
  
  <!-- Building Silhouettes -->
  <g opacity="0.15">
    <rect x="100" y="700" width="80" height="380" fill="#ffffff"/>
    <rect x="200" y="650" width="100" height="430" fill="#ffffff"/>
    <rect x="320" y="720" width="90" height="360" fill="#ffffff"/>
    <rect x="430" y="680" width="110" height="400" fill="#ffffff"/>
    <rect x="560" y="750" width="85" height="330" fill="#ffffff"/>
    <rect x="665" y="700" width="95" height="380" fill="#ffffff"/>
    <rect x="780" y="680" width="105" height="400" fill="#ffffff"/>
    <rect x="905" y="720" width="90" height="360" fill="#ffffff"/>
    <rect x="1015" y="650" width="100" height="430" fill="#ffffff"/>
    <rect x="1135" y="700" width="80" height="380" fill="#ffffff"/>
    <rect x="1235" y="680" width="110" height="400" fill="#ffffff"/>
    <rect x="1365" y="750" width="85" height="330" fill="#ffffff"/>
    <rect x="1470" y="700" width="95" height="380" fill="#ffffff"/>
    <rect x="1585" y="650" width="100" height="430" fill="#ffffff"/>
    <rect x="1705" y="720" width="90" height="360" fill="#ffffff"/>
  </g>
  
  <!-- Dashboard Elements -->
  <g transform="translate(960, 540)">
    <!-- Central Circle -->
    <circle cx="0" cy="0" r="180" fill="#ffffff" opacity="0.1"/>
    <circle cx="0" cy="0" r="140" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="100" fill="#ffffff" opacity="0.2"/>
    
    <!-- Data Lines -->
    <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3">
      <path d="M -180 0 Q -90 -60 0 0 Q 90 60 180 0"/>
      <path d="M -180 0 Q -90 60 0 0 Q 90 -60 180 0"/>
      <circle cx="-180" cy="0" r="4" fill="#ffffff"/>
      <circle cx="180" cy="0" r="4" fill="#ffffff"/>
      <circle cx="0" cy="-100" r="4" fill="#ffffff"/>
      <circle cx="0" cy="100" r="4" fill="#ffffff"/>
    </g>
    
    <!-- Central Icon -->
    <g fill="#ffffff" opacity="0.8">
      <rect x="-40" y="-40" width="80" height="80" rx="8"/>
      <rect x="-25" y="-25" width="50" height="8" rx="2" fill="#667eea"/>
      <rect x="-25" y="-10" width="35" height="6" rx="2" fill="#667eea"/>
      <rect x="-25" y="2" width="40" height="6" rx="2" fill="#667eea"/>
      <rect x="-25" y="14" width="30" height="6" rx="2" fill="#667eea"/>
    </g>
  </g>
  
  <!-- Floating Elements -->
  <g opacity="0.2">
    <rect x="300" y="300" width="60" height="60" rx="8" fill="#ffffff" transform="rotate(15 330 330)"/>
    <rect x="1500" y="400" width="50" height="50" rx="6" fill="#ffffff" transform="rotate(-20 1525 425)"/>
    <circle cx="400" cy="800" r="30" fill="#ffffff"/>
    <circle cx="1600" cy="600" r="25" fill="#ffffff"/>
    <rect x="250" y="500" width="40" height="40" rx="5" fill="#ffffff" transform="rotate(30 270 520)"/>
  </g>
  
  <!-- Grid Pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#grid)"/>
  </g>
</svg>