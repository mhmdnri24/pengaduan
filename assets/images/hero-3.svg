<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="report" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  
  <!-- Geometric Pattern -->
  <g opacity="0.08">
    <polygon points="0,0 200,0 100,173" fill="#ffffff"/>
    <polygon points="1720,0 1920,0 1920,173" fill="#ffffff"/>
    <polygon points="0,1080 200,1080 100,907" fill="#ffffff"/>
    <polygon points="1720,1080 1920,1080 1820,907" fill="#ffffff"/>
  </g>
  
  <!-- Central Report Interface -->
  <g transform="translate(960, 540)">
    <!-- Main Report Document -->
    <rect x="-150" y="-200" width="300" height="400" rx="8" fill="url(#report)"/>
    <rect x="-140" y="-190" width="280" height="380" rx="6" fill="#ffffff" opacity="0.15"/>
    
    <!-- Report Header -->
    <rect x="-130" y="-180" width="260" height="60" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="-120" y="-170" width="80" height="8" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="-30" y="-170" width="100" height="8" rx="2" fill="#ffffff" opacity="0.6"/>
    <rect x="-120" y="-155" width="140" height="6" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="-120" y="-145" width="100" height="6" rx="2" fill="#ffffff" opacity="0.5"/>
    
    <!-- Report Content Lines -->
    <g fill="#ffffff" opacity="0.6">
      <rect x="-120" y="-100" width="240" height="4" rx="1"/>
      <rect x="-120" y="-90" width="220" height="4" rx="1"/>
      <rect x="-120" y="-80" width="230" height="4" rx="1"/>
      <rect x="-120" y="-70" width="200" height="4" rx="1"/>
      <rect x="-120" y="-60" width="210" height="4" rx="1"/>
      <rect x="-120" y="-50" width="190" height="4" rx="1"/>
      <rect x="-120" y="-40" width="220" height="4" rx="1"/>
      <rect x="-120" y="-30" width="180" height="4" rx="1"/>
      <rect x="-120" y="-20" width="200" height="4" rx="1"/>
      <rect x="-120" y="-10" width="210" height="4" rx="1"/>
    </g>
    
    <!-- Report Checkboxes -->
    <g fill="#ffffff" opacity="0.8">
      <rect x="-120" y="10" width="12" height="12" rx="2"/>
      <rect x="-100" y="10" width="120" height="4" rx="1" opacity="0.6"/>
      
      <rect x="-120" y="30" width="12" height="12" rx="2"/>
      <rect x="-100" y="30" width="100" height="4" rx="1" opacity="0.6"/>
      
      <rect x="-120" y="50" width="12" height="12" rx="2"/>
      <rect x="-100" y="50" width="110" height="4" rx="1" opacity="0.6"/>
      
      <rect x="-120" y="70" width="12" height="12" rx="2"/>
      <rect x="-100" y="70" width="90" height="4" rx="1" opacity="0.6"/>
    </g>
    
    <!-- Report Status Badge -->
    <circle cx="100" cy="-150" r="25" fill="#ffffff" opacity="0.3"/>
    <circle cx="100" cy="-150" r="20" fill="#ffffff" opacity="0.5"/>
    <path d="M 90 -150 L 95 -145 L 110 -160" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Floating Report Cards -->
  <g opacity="0.25">
    <!-- Left Card -->
    <g transform="translate(300, 400)">
      <rect x="-60" y="-80" width="120" height="160" rx="6" fill="#ffffff"/>
      <rect x="-50" y="-70" width="100" height="8" rx="2" fill="#10b981" opacity="0.6"/>
      <rect x="-50" y="-55" width="80" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <rect x="-50" y="-45" width="90" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <rect x="-50" y="-35" width="70" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <circle cx="30" cy="-60" r="8" fill="#10b981" opacity="0.6"/>
    </g>
    
    <!-- Right Card -->
    <g transform="translate(1600, 350)">
      <rect x="-60" y="-80" width="120" height="160" rx="6" fill="#ffffff"/>
      <rect x="-50" y="-70" width="100" height="8" rx="2" fill="#10b981" opacity="0.6"/>
      <rect x="-50" y="-55" width="80" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <rect x="-50" y="-45" width="90" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <rect x="-50" y="-35" width="70" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <circle cx="30" cy="-60" r="8" fill="#10b981" opacity="0.6"/>
    </g>
    
    <!-- Bottom Card -->
    <g transform="translate(960, 850)">
      <rect x="-60" y="-80" width="120" height="160" rx="6" fill="#ffffff"/>
      <rect x="-50" y="-70" width="100" height="8" rx="2" fill="#10b981" opacity="0.6"/>
      <rect x="-50" y="-55" width="80" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <rect x="-50" y="-45" width="90" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <rect x="-50" y="-35" width="70" height="4" rx="1" fill="#06b6d4" opacity="0.6"/>
      <circle cx="30" cy="-60" r="8" fill="#10b981" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.15">
    <path d="M 300 400 Q 630 470 960 540"/>
    <path d="M 1600 350 Q 1280 445 960 540"/>
    <path d="M 960 850 Q 960 695 960 540"/>
  </g>
  
  <!-- Status Indicators -->
  <g opacity="0.3">
    <circle cx="200" cy="200" r="12" fill="#ffffff"/>
    <circle cx="200" cy="200" r="8" fill="#10b981"/>
    
    <circle cx="1800" cy="200" r="12" fill="#ffffff"/>
    <circle cx="1800" cy="200" r="8" fill="#10b981"/>
    
    <circle cx="200" cy="850" r="12" fill="#ffffff"/>
    <circle cx="200" cy="850" r="8" fill="#06b6d4"/>
    
    <circle cx="1800" cy="850" r="12" fill="#ffffff"/>
    <circle cx="1800" cy="850" r="8" fill="#06b6d4"/>
  </g>
  
  <!-- Floating Icons -->
  <g opacity="0.2">
    <!-- Check Icons -->
    <g transform="translate(250, 600)">
      <circle cx="0" cy="0" r="15" fill="#ffffff"/>
      <path d="M -8 0 L -3 5 L 8 -6" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <g transform="translate(1650, 650)">
      <circle cx="0" cy="0" r="15" fill="#ffffff"/>
      <path d="M -8 0 L -3 5 L 8 -6" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Document Icons -->
    <g transform="translate(400, 250)">
      <rect x="-10" y="-15" width="20" height="30" rx="2" fill="#ffffff"/>
      <rect x="-6" y="-10" width="12" height="2" fill="#10b981"/>
      <rect x="-6" y="-5" width="12" height="2" fill="#10b981"/>
      <rect x="-6" y="0" width="12" height="2" fill="#10b981"/>
      <rect x="-6" y="5" width="8" height="2" fill="#10b981"/>
    </g>
    
    <g transform="translate(1500, 700)">
      <rect x="-10" y="-15" width="20" height="30" rx="2" fill="#ffffff"/>
      <rect x="-6" y="-10" width="12" height="2" fill="#10b981"/>
      <rect x="-6" y="-5" width="12" height="2" fill="#10b981"/>
      <rect x="-6" y="0" width="12" height="2" fill="#10b981"/>
      <rect x="-6" y="5" width="8" height="2" fill="#10b981"/>
    </g>
  </g>
  
  <!-- Grid Pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#grid)"/>
  </g>
</svg>