<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  
  <!-- Wave Pattern -->
  <g opacity="0.1">
    <path d="M0,800 Q480,600 960,800 T1920,800 L1920,1080 L0,1080 Z" fill="#ffffff"/>
    <path d="M0,900 Q480,700 960,900 T1920,900 L1920,1080 L0,1080 Z" fill="#ffffff" opacity="0.5"/>
  </g>
  
  <!-- Search Magnifying Glass -->
  <g transform="translate(960, 540)">
    <!-- Outer Circle -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.4"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5"/>
    
    <!-- Handle -->
    <rect x="100" y="100" width="20" height="120" rx="10" fill="#ffffff" opacity="0.3" transform="rotate(45 110 110)"/>
    <rect x="105" y="105" width="10" height="110" rx="5" fill="#ffffff" opacity="0.4" transform="rotate(45 110 110)"/>
    
    <!-- Central Lens -->
    <circle cx="0" cy="0" r="80" fill="#ffffff" opacity="0.1"/>
    
    <!-- Search Icon Elements -->
    <g fill="#ffffff" opacity="0.7">
      <!-- Building Icons -->
      <rect x="-30" y="-20" width="15" height="25" rx="2"/>
      <rect x="-10" y="-25" width="20" height="30" rx="2"/>
      <rect x="15" y="-15" width="15" height="20" rx="2"/>
      
      <!-- User Icons -->
      <circle cx="-20" cy="10" r="6"/>
      <path d="M -30 25 Q -20 20 -10 25" fill="#ffffff"/>
      
      <circle cx="0" cy="10" r="6"/>
      <path d="M -10 25 Q 0 20 10 25" fill="#ffffff"/>
      
      <circle cx="20" cy="10" r="6"/>
      <path d="M 10 25 Q 20 20 30 25" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Data Points -->
  <g opacity="0.3">
    <circle cx="200" cy="200" r="8" fill="#ffffff"/>
    <circle cx="300" cy="150" r="6" fill="#ffffff"/>
    <circle cx="400" cy="250" r="10" fill="#ffffff"/>
    <circle cx="500" cy="180" r="7" fill="#ffffff"/>
    
    <circle cx="1600" cy="200" r="9" fill="#ffffff"/>
    <circle cx="1700" cy="150" r="6" fill="#ffffff"/>
    <circle cx="1500" cy="250" r="8" fill="#ffffff"/>
    <circle cx="1800" cy="180" r="7" fill="#ffffff"/>
    
    <circle cx="250" cy="800" r="8" fill="#ffffff"/>
    <circle cx="350" cy="850" r="6" fill="#ffffff"/>
    <circle cx="450" cy="780" r="10" fill="#ffffff"/>
    
    <circle cx="1550" cy="800" r="9" fill="#ffffff"/>
    <circle cx="1650" cy="850" r="7" fill="#ffffff"/>
    <circle cx="1450" cy="780" r="8" fill="#ffffff"/>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.2">
    <path d="M 200 200 Q 580 370 960 540"/>
    <path d="M 400 250 Q 680 395 960 540"/>
    <path d="M 1600 200 Q 1280 370 960 540"/>
    <path d="M 1800 180 Q 1380 360 960 540"/>
    <path d="M 250 800 Q 605 670 960 540"/>
    <path d="M 450 780 Q 705 660 960 540"/>
    <path d="M 1550 800 Q 1255 670 960 540"/>
    <path d="M 1450 780 Q 1205 660 960 540"/>
  </g>
  
  <!-- Floating Search Elements -->
  <g opacity="0.2">
    <g transform="translate(300, 400)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
      <rect x="15" y="15" width="8" height="25" rx="4" fill="#ffffff" transform="rotate(45 19 19)"/>
    </g>
    
    <g transform="translate(1600, 350)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
      <rect x="10" y="10" width="6" height="20" rx="3" fill="#ffffff" transform="rotate(45 13 13)"/>
    </g>
    
    <g transform="translate(400, 700)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
      <rect x="13" y="13" width="7" height="22" rx="3" fill="#ffffff" transform="rotate(45 16.5 16.5)"/>
    </g>
    
    <g transform="translate(1500, 750)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
      <rect x="8" y="8" width="5" height="15" rx="2" fill="#ffffff" transform="rotate(45 10.5 10.5)"/>
    </g>
  </g>
  
  <!-- Grid Pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#grid)"/>
  </g>
</svg>