name: pengaduan
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.0.1
  flutter_overlay_window: 0.5.0
  overlay_support: ^2.0.0
  firebase_core: ^2.8.0
  firebase_messaging: ^14.6.6
  audioplayers: ^5.2.1
  http: ^1.5.0
  pin_code_fields: ^8.0.1
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.1.1
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  google_fonts: ^6.2.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  rename_app: ^1.6.5
  device_info_plus: ^10.1.0
  provider: ^6.1.1
  quickalert: ^1.1.0
  google_maps_flutter: ^2.13.1
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1
  webview_flutter_wkwebview: ^3.9.4
  photo_view: ^0.15.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sound/urgent.wav
    - assets/images/profile.jpeg
    - assets/images/back-arrow.png
    - assets/images/splash.jpg
    - assets/images/splash.webp
  # fonts:
  # - family: Poppins
  #   fonts:
  #     - asset: assets/fonts/Poppins-Regular.ttf
  #     - asset: assets/fonts/Poppins-Medium.ttf
  #       weight: 500
  #     - asset: assets/fonts/Poppins-SemiBold.ttf
  #       weight: 600
  #     - asset: assets/fonts/Poppins-Bold.ttf
  #       weight: 700
flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

