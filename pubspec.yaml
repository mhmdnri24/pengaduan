name: pengaduan
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.0.1
  flutter_overlay_window: 0.5.0
  overlay_support: ^2.0.0
