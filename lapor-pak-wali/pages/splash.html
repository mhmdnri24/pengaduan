<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Lapor Pak Wali - Layanan Digital Pemerintah Daerah">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lapor Pak Wali</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #1e40af;
            --background-color: #1e40af;
            --text-color: #ffffff;
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            background-color: var(--background-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .shape-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .shape {
            position: absolute;
            color: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite linear alternate;
            font-size: 24px;
        }
        
        .shape.star1 { top: 15%; left: 10%; font-size: 20px; animation-duration: 25s; }
        .shape.star2 { top: 25%; right: 15%; font-size: 30px; animation-duration: 35s; }
        .shape.star3 { bottom: 20%; left: 20%; font-size: 16px; animation-duration: 30s; }
        .shape.star4 { bottom: 10%; right: 10%; font-size: 24px; animation-duration: 40s; }
        .shape.line1 { top: 50%; left: 5%; width: 80px; height: 2px; background: currentColor; animation-duration: 20s; }
        .shape.line2 { top: 70%; right: 5%; width: 100px; height: 2px; background: currentColor; animation-duration: 28s; }
        
        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Changed to center */
            height: 100%;
            width: 100%;
            padding: 40px 24px;
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
            text-align: center;
            z-index: 10;
        }
        
        .app-header {
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
            flex-grow: 1; /* Added */
            display: flex; /* Added */
            flex-direction: column; /* Added */
            align-items: center; /* Added */
            justify-content: center; /* Added */
        }

        .logo-container {
            margin-bottom: 24px;
        }
        
        .logo {
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        
        .logo img {
            width: 110px;
            height: auto;
            object-fit: contain;
        }
        
        .app-title {
            color: var(--text-color);
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 16px;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .app-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            font-weight: 400;
            max-width: 320px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .app-footer {
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 1s ease-out 0.2s forwards;
            opacity: 0;
            transform: translateY(30px);
            padding-bottom: 20px; /* Added padding */
        }

        .action-buttons {
            display: flex;
            flex-direction: row;
            gap: 16px;
            width: 100%;
            margin-bottom: 24px;
        }
        
        .btn {
            flex: 1;
            padding: 18px 12px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: var(--secondary-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-color);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.98);
        }
        
        .version-info {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="shape-bg">
        <i class="fas fa-star shape star1"></i>
        <i class="fas fa-star shape star2"></i>
        <i class="fas fa-star shape star3"></i>
        <i class="fas fa-star shape star4"></i>
        <div class="shape line1"></div>
        <div class="shape line2"></div>
    </div>

    <div class="splash-container">
        <header class="app-header">
            <div class="logo-container">
                <div class="logo">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzv5eKWXAQb7CMv1Fqi_v39to1ESNAulKPkg&s" alt="Logo Linggau Juara">
                </div>
            </div>
            <h1 class="app-title">Lapor Pak Wali</h1>
            <p class="app-subtitle">Layanan pengaduan digital untuk respon cepat dan transparan.</p>
        </header>
        
        <footer class="app-footer">
            <div class="action-buttons">
                <a href="mobile-register.html" class="btn btn-secondary">Daftar</a>
                <a href="mobile-login.html" class="btn btn-primary">Masuk</a>
            </div>
            <div class="version-info">
                Versi 1.0.7
            </div>
        </footer>
    </div>

    <script>
        // Preload pages for faster navigation
        function preloadPages() {
            const pages = ['mobile-login.html', 'mobile-register.html'];
            pages.forEach(page => {
                const link = document.createElement('link');
                link.rel = 'prefetch';
                link.href = page;
                document.head.appendChild(link);
            });
        }
        window.addEventListener('load', preloadPages);
    </script>
</body>
</html>
