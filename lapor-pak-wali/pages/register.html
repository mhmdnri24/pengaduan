<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daftar Akun Lapor Pak Wali - Bergabung dengan Platform Laporan Masyarakat">
    <meta name="theme-color" content="#1e40af">
    <title>Daftar Akun - Lapor Pak Wali</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#1e40af',
                        'secondary-blue': '#3b82f6',
                        'accent-blue': '#60a5fa',
                        'dark-blue': '#1e3a8a'
                    },
                    fontFamily: {
                        'sans': ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .form-step {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        .form-step.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-sans text-slate-800 antialiased bg-slate-50">

    <div class="min-h-screen flex flex-col justify-center py-10 sm:bg-cover sm:bg-center sm:bg-no-repeat" style="background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=1974&q=80');">
        
        <div class="hidden sm:block sm:absolute sm:inset-0 sm:bg-gradient-to-br sm:from-primary-blue/80 sm:to-accent-blue/70"></div>

        <div class="relative w-full bg-white px-6 py-8 sm:max-w-md sm:mx-auto sm:rounded-2xl sm:shadow-2xl overflow-hidden">
            
            <div class="mb-8">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-semibold text-primary-blue" id="stepTitle">Langkah 1 dari 3</span>
                    <span class="text-sm font-bold text-primary-blue" id="stepPercentage">33%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2">
                    <div id="progressBar" class="bg-gradient-to-r from-secondary-blue to-accent-blue h-2 rounded-full transition-all duration-500" style="width: 33%;"></div>
                </div>
            </div>

            <form id="registerForm" novalidate>
                <fieldset class="form-step active" data-step="1">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold text-slate-900">Informasi Pribadi</h1>
                        <p class="text-slate-500 text-sm mt-1">Pastikan data sesuai dengan KTP Anda.</p>
                    </div>
                    <div class="space-y-5">
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-blue transition-colors">
                                <i class="fas fa-user fa-fw"></i>
                            </div>
                            <input type="text" id="namaLengkap" name="namaLengkap"
                                class="w-full pl-10 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-lg text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-blue/50 focus:border-primary-blue"
                                placeholder="Nama Lengkap" required minlength="3">
                        </div>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-blue transition-colors">
                                <i class="fas fa-id-card fa-fw"></i>
                            </div>
                            <input type="text" id="nikKtp" name="nikKtp"
                                class="w-full pl-10 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-lg text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-blue/50 focus:border-primary-blue"
                                placeholder="16 Digit NIK KTP" required pattern="[0-9]{16}" maxlength="16" inputmode="numeric">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-step" data-step="2">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold text-slate-900">Informasi Kontak</h1>
                        <p class="text-slate-500 text-sm mt-1">Digunakan untuk verifikasi dan notifikasi.</p>
                    </div>
                     <div class="space-y-5">
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-blue transition-colors">
                                <i class="fab fa-whatsapp fa-fw"></i>
                                <span class="ml-2 text-sm text-slate-500 font-medium">+62</span>
                            </div>
                            <input type="tel" id="nomorWa" name="nomorWa"
                                class="w-full pl-16 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-lg text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-blue/50 focus:border-primary-blue"
                                placeholder="812 3456 7890" required pattern="[0-9]{10,13}" maxlength="13" inputmode="numeric">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-step" data-step="3">
                     <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold text-slate-900">Persetujuan Akhir</h1>
                        <p class="text-slate-500 text-sm mt-1">Satu langkah lagi untuk menyelesaikan.</p>
                    </div>
                    <div class="space-y-5">
                        <div class="bg-sky-50 border-l-4 border-sky-400 p-4 rounded-r-lg">
                             <label class="flex items-start gap-3 cursor-pointer select-none">
                                <input type="checkbox" id="termsConditions" name="termsConditions" required
                                    class="mt-0.5 h-4 w-4 flex-shrink-0 text-primary-blue rounded border-slate-300 focus:ring-primary-blue">
                                <span class="text-xs text-slate-700">
                                    Saya menyatakan bahwa data yang saya isi adalah benar dan saya telah membaca serta setuju dengan 
                                    <a href="javascript:void(0)" id="termsLink" class="font-semibold text-primary-blue hover:underline">Syarat & Ketentuan</a> dan
                                    <a href="javascript:void(0)" id="privacyLink" class="font-semibold text-primary-blue hover:underline">Kebijakan Privasi</a>.
                                </span>
                            </label>
                        </div>
                        <div class="text-center pt-2">
                            <p class="text-xs text-slate-500 flex items-center justify-center gap-2">
                                <i class="fas fa-shield-alt text-green-600"></i> Data Anda dijamin aman dan terenkripsi.
                            </p>
                        </div>
                    </div>
                </fieldset>

                <div class="mt-10 flex justify-between items-center">
                    <button type="button" id="prevBtn" class="text-sm font-semibold text-slate-600 hover:text-primary-blue transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        Kembali
                    </button>
                    <button type="button" id="nextBtn" class="bg-primary-blue hover:bg-dark-blue text-white font-bold py-2.5 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-blue transition duration-300 shadow-lg shadow-primary-blue/30 active:scale-95">
                        Lanjutkan
                    </button>
                    <button type="submit" id="submitBtn" class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-400 transition duration-300 shadow-lg shadow-green-600/30 active:scale-95">
                        Daftar Akun Saya
                    </button>
                </div>
                <p class="text-center text-sm text-slate-500 mt-8">
                    Sudah punya akun? 
                    <a href="login.html" class="font-semibold text-primary-blue hover:underline">Masuk di sini</a>
                </p>
            </form>
        </div>
    </div>
    
    <div id="legalModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl transform transition-all duration-300 scale-95 opacity-0" id="modalCard">
            <div class="flex items-center justify-between p-5 border-b border-gray-200 sticky top-0 bg-white rounded-t-2xl">
                <h2 class="text-xl font-bold text-gray-800" id="modalTitle"></h2>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            <div class="max-h-[70vh] overflow-y-auto p-6 text-gray-600 text-sm leading-relaxed space-y-4" id="modalContent">
                </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // === KONTEN LENGKAP UNTUK MODAL ===
            const termsContent = `
                <h3 class="font-bold text-base text-gray-800">1. Penerimaan Ketentuan</h3>
                <p>Dengan mendaftar dan menggunakan aplikasi Lapor Pak Wali ("Aplikasi"), Anda setuju untuk terikat oleh Syarat dan Ketentuan ini. Jika Anda tidak setuju, mohon untuk tidak menggunakan Aplikasi ini.</p>
                <h3 class="font-bold text-base text-gray-800">2. Penggunaan Aplikasi</h3>
                <p>Aplikasi ini bertujuan sebagai sarana bagi masyarakat Kota Lubuklinggau untuk menyampaikan laporan, aspirasi, dan keluhan terkait pelayanan publik. Pengguna wajib:</p>
                <ul class="list-disc list-inside pl-4 space-y-1">
                    <li>Memberikan informasi yang benar, akurat, dan dapat dipertanggungjawabkan (Nama, NIK, No. WhatsApp).</li>
                    <li>Menggunakan bahasa yang sopan dan tidak mengandung unsur SARA, ujaran kebencian, atau provokasi.</li>
                    <li>Tidak menyebarkan informasi palsu (hoax) atau informasi yang tidak relevan.</li>
                    <li>Tidak menggunakan aplikasi untuk tujuan darurat (misalnya: kebakaran, kecelakaan, atau tindak kriminal yang memerlukan penanganan segera). Silakan hubungi nomor darurat yang berwenang.</li>
                </ul>
                <h3 class="font-bold text-base text-gray-800">3. Konten Laporan</h3>
                <p>Anda bertanggung jawab penuh atas seluruh konten (teks, foto, video) yang Anda kirimkan. Dengan mengirimkan laporan, Anda memberikan hak kepada Pemerintah Kota Lubuklinggau untuk menggunakan, memverifikasi, dan mendistribusikan laporan Anda kepada dinas atau instansi terkait untuk ditindaklanjuti.</p>
                <h3 class="font-bold text-base text-gray-800">4. Perubahan Ketentuan</h3>
                <p>Kami dapat mengubah Syarat dan Ketentuan ini dari waktu ke waktu. Perubahan akan diinformasikan melalui Aplikasi atau media lain yang relevan. Dengan terus menggunakan Aplikasi setelah perubahan, Anda dianggap menyetujui ketentuan yang baru.</p>
            `;

            const privacyContent = `
                <p>Pemerintah Kota Lubuklinggau berkomitmen untuk melindungi privasi data pribadi Anda. Kebijakan Privasi ini menjelaskan bagaimana kami mengumpulkan, menggunakan, dan melindungi informasi Anda.</p>
                <h3 class="font-bold text-base text-gray-800">1. Informasi yang Kami Kumpulkan</h3>
                <p>Kami mengumpulkan informasi yang Anda berikan secara langsung saat pendaftaran dan pelaporan, termasuk:</p>
                <ul class="list-disc list-inside pl-4 space-y-1">
                    <li><b>Data Identitas:</b> Nama Lengkap dan Nomor Induk Kependudukan (NIK) untuk verifikasi.</li>
                    <li><b>Data Kontak:</b> Nomor WhatsApp aktif untuk komunikasi dan notifikasi status laporan.</li>
                    <li><b>Data Laporan:</b> Deskripsi masalah, foto/video pendukung, dan data lokasi (jika diizinkan).</li>
                </ul>
                <h3 class="font-bold text-base text-gray-800">2. Penggunaan Informasi</h3>
                <p>Informasi Anda akan digunakan untuk:</p>
                <ul class="list-disc list-inside pl-4 space-y-1">
                    <li>Memverifikasi identitas Anda sebagai pelapor yang sah.</li>
                    <li>Memproses dan meneruskan laporan Anda ke dinas atau instansi pemerintah yang berwenang.</li>
                    <li>Memberikan pembaruan (notifikasi) mengenai status tindak lanjut laporan Anda melalui WhatsApp.</li>
                </ul>
                <h3 class="font-bold text-base text-gray-800">3. Keamanan dan Pembagian Data</h3>
                <p>Kami menerapkan langkah-langkah keamanan untuk melindungi data Anda. Data pribadi Anda <b>tidak akan dibagikan</b> kepada pihak ketiga di luar instansi Pemerintah Kota Lubuklinggau yang relevan, kecuali diwajibkan oleh hukum.</p>
            `;

            // === LOGIKA LENGKAP UNTUK MODAL ===
            const modal = document.getElementById('legalModal');
            const modalCard = document.getElementById('modalCard');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const termsLink = document.getElementById('termsLink');
            const privacyLink = document.getElementById('privacyLink');

            const openModal = (title, content) => {
                modalTitle.textContent = title;
                modalContent.innerHTML = content;
                modalContent.scrollTop = 0;
                modal.classList.remove('hidden');
                document.body.classList.add('overflow-hidden');
                setTimeout(() => {
                    modalCard.classList.remove('scale-95', 'opacity-0');
                }, 50);
            };

            const closeModal = () => {
                modalCard.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    document.body.classList.remove('overflow-hidden');
                }, 300);
            };

            termsLink.addEventListener('click', () => openModal('Syarat & Ketentuan', termsContent));
            privacyLink.addEventListener('click', () => openModal('Kebijakan Privasi', privacyContent));
            closeModalBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (event) => {
                if (event.target === modal) closeModal();
            });

            // === LOGIKA FORM MULTI-LANGKAH ===
            const steps = Array.from(document.querySelectorAll('.form-step'));
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');
            const submitBtn = document.getElementById('submitBtn');
            const form = document.getElementById('registerForm');
            const progressBar = document.getElementById('progressBar');
            const stepTitle = document.getElementById('stepTitle');
            const stepPercentage = document.getElementById('stepPercentage');

            let currentStep = 0;

            const updateFormSteps = () => {
                steps.forEach((step, index) => {
                    step.classList.toggle('active', index === currentStep);
                });
                const progress = ((currentStep + 1) / steps.length) * 100;
                progressBar.style.width = `${progress}%`;
                stepTitle.textContent = `Langkah ${currentStep + 1} dari ${steps.length}`;
                stepPercentage.textContent = `${Math.round(progress)}%`;
                prevBtn.disabled = currentStep === 0;
                prevBtn.classList.toggle('hidden', currentStep === 0);
                nextBtn.classList.toggle('hidden', currentStep === steps.length - 1);
                submitBtn.classList.toggle('hidden', currentStep !== steps.length - 1);
            };
            
            const validateStep = (stepIndex) => {
                const currentFields = steps[stepIndex].querySelectorAll('input[required]');
                for (const input of currentFields) {
                    if (!input.checkValidity()) {
                        input.reportValidity(); 
                        return false;
                    }
                }
                return true;
            };

            nextBtn.addEventListener('click', () => {
                if (validateStep(currentStep) && currentStep < steps.length - 1) {
                    currentStep++;
                    updateFormSteps();
                }
            });

            prevBtn.addEventListener('click', () => {
                if (currentStep > 0) {
                    currentStep--;
                    updateFormSteps();
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (validateStep(currentStep)) {
                    // Tampilkan notifikasi loading SweetAlert
                    Swal.fire({
                        title: 'Memproses Pendaftaran...',
                        text: 'Mohon tunggu sebentar, data Anda sedang kami simpan.',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    // Simulasi proses backend (misal: 2 detik)
                    setTimeout(() => {
                        // Tampilkan notifikasi sukses
                        Swal.fire({
                            icon: 'success',
                            title: 'Pendaftaran Berhasil!',
                            text: 'Akun Anda telah dibuat. Anda akan diarahkan ke halaman login.',
                            timer: 3000,
                            timerProgressBar: true,
                            confirmButtonText: 'OK, Lanjutkan!',
                        }).then(() => {
                            // Arahkan ke halaman login
                            window.location.href = 'login.html';
                        });
                    }, 2000);
                }
            });

            // Inisialisasi form
            updateFormSteps();
        });
    </script>
</body>
</html>
